id: submission-request.approved-pending-multiple
contentFile: approved-pending-multiple.md
name: Submission Request Approved with Multiple Pending Conditions
description: Sent to the submitter when the SRC approves an SRF with more than one pending condition. Which conditions appear is determined at send time.
notificationKey: submission_request:reviewed
subject: "CRDC Submission Request Decision"
variables:
